<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a0a0a"/>
      <stop offset="100%" stop-color="#151515"/>
    </linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#16a34a"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
  </defs>

  <rect width="32" height="32" rx="7" fill="url(#bg)"/>

  <!-- Orbiting ring -->
  <circle cx="16" cy="16" r="11" fill="none" stroke="url(#glow)" stroke-width="1.2" opacity="0.3">
    <animateTransform attributeName="transform" type="rotate" from="0 16 16" to="360 16 16" dur="6s" repeatCount="indefinite"/>
  </circle>

  <!-- Pulsing outer ring -->
  <circle cx="16" cy="16" r="12.5" fill="none" stroke="#16a34a" stroke-width="0.5" opacity="0.15">
    <animate attributeName="r" values="11;13;11" dur="3s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.15;0.3;0.15" dur="3s" repeatCount="indefinite"/>
  </circle>

  <!-- L letter -->
  <text x="16" y="21.5" text-anchor="middle" font-family="'Space Grotesk', sans-serif" font-weight="700" font-size="16" fill="url(#glow)">L</text>

  <!-- Orbiting dot -->
  <circle cx="16" cy="4.5" r="1.5" fill="#16a34a">
    <animateTransform attributeName="transform" type="rotate" from="0 16 16" to="360 16 16" dur="6s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="1;0.4;1" dur="2s" repeatCount="indefinite"/>
  </circle>
</svg>
